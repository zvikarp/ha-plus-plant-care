name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS archive
        run: cd custom_components/plant_care_plus && zip -r ../../plant_care_plus.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: plant_care_plus.zip
