[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-plus-plant-care"
version = "0.1.2"
description = "HA Plus Plant Care integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "HA Plus Plant Care contributors" }]

[project.urls]
Documentation = "https://github.com/zvikarp/ha-plus-plant-care#readme"
Issues = "https://github.com/zvikarp/ha-plus-plant-care/issues"
Source = "https://github.com/zvikarp/ha-plus-plant-care"

[project.optional-dependencies]
test = [
  "mypy>=1.15.0",
  "pytest-homeassistant-custom-component==0.13.204",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=custom_components.plant_care_plus --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]
ignore = [
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
